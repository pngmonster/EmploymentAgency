<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}JobBureau{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
  {% block extra_css %}{% endblock %}

  <!-- Применяем тему ДО рендера страницы — без мерцания -->
  <script>
    (function() {
      var theme = localStorage.getItem('theme') || 'dark';
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>

  {% if messages %}
  <div class="toast-container">
    {% for msg in messages %}
    <div class="toast toast--{{ msg.level_tag }}">{{ msg }}</div>
    {% endfor %}
  </div>
  {% endif %}

  {% block body %}{% endblock %}

  <script>
    // Toast автоскрытие
    document.querySelectorAll('.toast').forEach(function(t) {
      setTimeout(function() {
        t.style.opacity = '0';
        t.style.transform = 'translateX(20px)';
        t.style.transition = 'opacity .4s ease, transform .4s ease';
        setTimeout(function() { t.remove(); }, 400);
      }, 3000);
    });

    // Переключение темы
    function toggleTheme() {
      var html  = document.documentElement;
      var current = html.getAttribute('data-theme') || 'dark';
      var next    = current === 'dark' ? 'light' : 'dark';
      html.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    }
  </script>
  <script src="{% static 'js/file-input.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
